<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b0b0d">
<title>Kapi Web</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Caveat:wght@500;700&family=Special+Elite&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">

  <section id="splash" class="screen on"><div class="logo">KAPI<span>web</span></div><p class="mut">retro camera &amp; collage studio</p></section>

  <section id="perm" class="screen center">
    <div class="permic">◉</div><h2>Let Kapi see the world</h2>
    <p class="mut">Kapi uses your camera for the live viewfinder and your microphone only when you record video. Nothing is uploaded — everything stays on this device.</p>
    <button class="btn pri block" id="perm-allow">Allow camera</button><button class="btn ghost block" id="perm-skip">Not now</button>
  </section>

  <section id="intro" class="screen">
    <button class="btn ghost skip" id="intro-skip">Skip</button>
    <div class="slides"><div id="intro-slides"></div></div>
    <div class="dots" id="intro-dots"></div><button class="btn pri block foot" id="intro-next">Next</button>
  </section>

  <!-- CAMERA -->
  <section id="cam" class="screen">
    <div class="topbar cam-top">
      <button class="ib sq" id="c-flash" title="Flash"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></svg></button>
      <button class="ib sq" id="c-timer" title="Timer"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9 2h6"/></svg><span>Off</span></button>
      <button class="ib sq" id="c-grid" title="Grid"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18M15 3v18M3 9h18M3 15h18"/></svg></button>
      <button class="ib sq" id="c-ratio" title="Aspect"><span>3:4</span></button>
      <button class="ib sq" id="c-lens" title="Fisheye lens"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/></svg></button>
      <button class="ib sq" id="c-date" title="Date stamp"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></button>
      <button class="ib sq" id="c-set" title="Settings"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg></button>
    </div>
    <div class="viewwrap">
      <div id="cam-view">
        <video id="cam-video" playsinline muted autoplay></video>
        <canvas id="cam-cv" width="400" height="533"></canvas>
        <div id="cam-grid"></div><div id="cam-flash"></div><div id="cam-count"></div><div id="cam-rectime"></div>
        <div id="c-zoom"><button data-z="1" class="on">1x</button><button data-z="1.6">1.6x</button></div>
        <button class="chip hold" id="c-cmp">hold: original</button>
        <div id="cam-denied"><div><div class="permic">◉</div><p></p>
          <label class="btn pri block">Use device camera<input type="file" id="cam-file" accept="image/*" capture="environment" hidden></label>
          <button class="btn block" id="cam-import">Import from library</button><button class="btn ghost block" id="cam-retry">Try camera again</button></div></div>
      </div>
    </div>
    <div class="camdock">
      <div id="c-man" class="manual"></div>
      <div class="row sp pad2"><button class="chip" id="c-manual"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg>Manual</button><button class="chip acc" id="c-ai">✦ AI pick</button></div>
      <div id="cam-filters"></div>
      <div id="c-modes" class="modes"><button data-m="photo" class="on">PHOTO</button><button data-m="video">VIDEO</button><button data-m="live">LIVE</button></div>
      <div class="shutrow">
        <button id="cam-gal" class="galbtn" aria-label="Gallery"><span><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="2"/><path d="M21 16l-5-5L5 21"/></svg></span></button>
        <button id="cam-shutter" class="shutter photo" aria-label="Shutter"><i></i></button>
        <button id="cam-flip" class="ib flip" aria-label="Flip camera"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h13l-3-3M20 16H7l3 3"/></svg></button>
      </div>
    </div>
  </section>

  <!-- EDITOR -->
  <section id="ed" class="screen">
    <div class="edtop">
      <button class="cbtn" id="ed-back" aria-label="Back"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
      <div class="mid">
        <button class="ibtn" id="ed-undo" aria-label="Undo" disabled><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-3"/></svg></button>
        <button class="ibtn" id="ed-redo" aria-label="Redo" disabled><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 000 12h3"/></svg></button>
      </div>
      <button class="cbtn" id="ed-ok" aria-label="Done"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg></button>
    </div>
    <div class="stagewrap"><canvas id="ed-stage" width="720" height="960"></canvas>
      <button class="chip cmpb" id="ed-cmpbtn">&#9704; Slide</button><button class="chip cmpb stk" id="ed-stackbtn">&#9636; Stack</button></div>
    <div id="ed-crop" class="croprow"><button data-r="9:16">9:16</button><button data-r="3:4">3:4</button><button data-r="4:5">4:5</button><button data-r="1:1">1:1</button><button data-r="orig">Free</button><button id="ed-rot" aria-label="Rotate">&#10227;</button><button id="ed-flip" aria-label="Mirror">&#8651;</button><button id="ed-reset" aria-label="Reset zoom">&#10530;</button></div>
    <div class="strip2">
      <div id="ed-strip" class="strip"></div>
      <button class="sbtn" id="ed-hold" aria-label="Hold to compare"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M12 2v20"/></svg></button>
    </div>
    <div class="panel">
      <div id="ed-ctrl" class="ctrl"></div>
      <div id="ed-tabs" class="tabs"></div>
      <div id="ed-cards" class="cards2"></div>
    </div>
  </section>

  <!-- GALLERY -->
  <section id="gal" class="screen">
    <div class="topbar">
      <button class="ib" id="gal-back" style="display:none"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button><h1 id="gal-title">Gallery</h1>
      <div class="row gap"><button class="chip" id="gal-sel">Select</button><button class="ib" id="gal-more" title="Album options" style="display:none"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/></svg></button><button class="ib" id="gal-imp" title="Import"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button><button class="ib" id="gal-set" title="Settings"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg></button></div>
    </div>
    <div class="seg" id="gal-tabs"><button data-t="recent" class="on">Recent</button><button data-t="albums">Albums</button></div>
    <div id="gal-body" class="galbody"></div>
    <div id="gal-bar" class="selbar"><span id="gal-count">0 selected</span><span class="row gap"><button class="chip" id="b-restore">Restore</button><button class="chip" id="b-fav">♡ Favourite</button><button class="chip" id="b-move">▤ Album</button><button class="chip danger" id="b-del">🗑 Delete</button></span></div>
    <button class="fab" onclick="K.go('cam')" aria-label="Camera"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v12H4z"/><circle cx="12" cy="13" r="4"/></svg></button>
  </section>

  <!-- SETTINGS -->
  <section id="set" class="screen">
    <div class="topbar"><button class="ib" id="set-back"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button><h1>Settings</h1><span style="width:44px"></span></div>
    <div id="set-body" class="galbody"></div>
  </section>

  <div id="overlays"></div><div id="toast"></div>
  <input type="file" id="imp-file" accept="image/*,video/*" multiple hidden>
</div>
<script src="js/core.js"></script>
<script src="js/filters.js"></script>
<script src="js/effects.js"></script>
<script src="js/collage.js"></script>
<script src="js/render.js"></script>
<script src="js/editor.js"></script>
<script src="js/camera.js"></script>
<script src="js/gallery.js"></script>
<script src="js/app.js"></script>
</body>
</html>
